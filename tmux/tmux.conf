# SYMLINK: ~/.config/tmux/tmux.conf

# Full Tmux Conf
source-file ~/.config/tmux/tmux.reset.conf
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -as terminal-overrides ",*:RGB"

# Prefix
set -g prefix `
bind ` send-prefix
set -gq allow-passthrough on
# Core options
set -g base-index 1
set -g pane-base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
set -g mouse on
set -g repeat-time 1000
setw -g mode-keys vi

# Copy-mode: vi-style selection and system clipboard yank
bind -T copy-mode-vi v send -X begin-selection       # v → start visual selection
bind -T copy-mode-vi V send -X select-line            # V → select whole line
bind -T copy-mode-vi C-v send -X rectangle-toggle     # C-v → block selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"   # y → yank to clipboard
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "xclip -selection clipboard; xclip -selection primary -o | xclip -selection clipboard"  # Y → yank line to clipboard

# Minimal visual tweaks
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded ✓"   # prefix + R

# Keybindings: hjkl pane navigation
bind h select-pane -L          # prefix + h → pane left
bind j select-pane -D          # prefix + j → pane down
bind k select-pane -U          # prefix + k → pane up
bind l select-pane -R          # prefix + l → pane right
bind -r H resize-pane -L       # prefix + H → resize left  (repeatable)
bind -r J resize-pane -D       # prefix + J → resize down  (repeatable)
bind -r K resize-pane -U       # prefix + K → resize up    (repeatable)
bind -r L resize-pane -R       # prefix + L → resize right (repeatable)


# Keybindings: split (preserve cwd)
bind v split-window -h -c "#{pane_current_path}"    # prefix + v → vertical split
bind s split-window -v -c "#{pane_current_path}"    # prefix + s → horizontal split

# Keybindings: other
bind f resize-pane -Z                                     # prefix + f → zoom pane
bind q display-panes                                      # prefix + q → show pane numbers
bind Q detach-client                                      # prefix + Q → detach
bind e display-popup -E "tmux choose-tree -Zw"            # prefix + e → fuzzy session/window tree
bind ? display-popup -E -w 90 -h 30 "grep -E '^(# Key|bind )' ~/.config/tmux/tmux.conf | grep -v '@plugin' | less"  # prefix + ? → cheatsheet
bind -n M-h select-pane -L                                # Alt+h → pane left  (no prefix)
bind -n M-j select-pane -D                                # Alt+j → pane down  (no prefix)
bind -n M-k select-pane -U                                # Alt+k → pane up    (no prefix)
bind -n M-l select-pane -R                                # Alt+l → pane right (no prefix)
bind -n M-f resize-pane -Z                                # Alt+f → zoom pane  (no prefix)

# Keybindings: windows
bind c new-window                                                          # prefix + c → new window
bind , command-prompt "rename-window '%%'"                                 # prefix + , → rename window
bind p previous-window                                                     # prefix + p → last window
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane                   # prefix + x → kill pane (confirm)
bind X kill-session                                                        # prefix + X → kill session
bind -r '<' swap-window -d -t -1                                           # prefix + < → move window left
bind -r '>' swap-window -d -t +1                                           # prefix + > → move window right
bind ! break-pane -d                                                       # prefix + ! → promote pane to window
bind @ command-prompt -p "join pane from: " "join-pane -s '%%'"           # prefix + @ → pull window into pane

# Keybindings: sessions
bind N new-session                                                              # prefix + N → new session
bind . command-prompt "rename-session '%%'"                                     # prefix + . → rename session
bind ) switch-client -n                                                         # prefix + ) → next session
bind ( switch-client -p                                                         # prefix + ( → prev session

# Keybindings: clear scrollback
bind C-l send-keys -R \; clear-history \; display-message "Cleared!"            # prefix + C-l → clear scrollback

# Plugin: tmux continuum
set -g @continuum-restore 'on'

# Plugin: tmux ressurect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Plugin: tmux fzf
set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_ORDER="window|session|pane|command|keybinding"
bind-key w run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/window.sh switch"
bind-key a run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"
TMUX_FZF_PREVIEW=0

# Plugin: tmux dotbar
set -g @tmux-dotbar-bg "default"              # bg0
set -g @tmux-dotbar-fg "#5a524c"              # grey1
set -g @tmux-dotbar-fg-current "#d4be98"      # fg
set -g @tmux-dotbar-fg-session "#7daea3"      # aqua
set -g @tmux-dotbar-fg-prefix "#ea6962"       # red
set -g @tmux-dotbar-position "top"
set -g @tmux-dotbar-justify "absolute-centre"
set -g @tmux-dotbar-bold-current-window true
set -g @tmux-dotbar-right "false"
set -g @tmux-dotbar-window-status-separator ""

# Plugins: Extra
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'vaaleyard/tmux-dotbar'

run '~/.tmux/plugins/tpm/tpm'
