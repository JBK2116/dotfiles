# SYMLINK: ~/.config/kitty/kitty.conf

# Environment
term xterm-256color

# Window
window_padding_width      2
hide_window_decorations   yes
background_opacity        1.0
dynamic_background_opacity no
resize_in_steps           no

# Scrollback
scrollback_lines        10000
wheel_scroll_multiplier 3.0

# Font
font_family      Fira Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# Cursor
cursor_shape           block

# Mouse
mouse_hide_wait -1
mouse_map right  press ungrabbed paste_from_clipboard
mouse_map middle press ungrabbed paste_from_selection

# Clipboard / Selection
copy_on_select    yes
clipboard_control write-clipboard write-primary read-clipboard read-primary
select_by_word_characters @-./_~?&=%+#

# URLs
url_prefixes ipfs ipns magnet mailto gemini gopher https http news file git ssh ftp
detect_urls  yes

# Keybindings
, session: AsyncSession
# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Font size
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# Scrolling
map shift+page_up   scroll_page_up
map shift+page_down scroll_page_down
map shift+home      scroll_home
map shift+end       scroll_end

# Window management
map ctrl+shift+n     new_os_window
map ctrl+shift+enter new_os_window
map ctrl+shift+q     quit
map f11              toggle_fullscreen

# URL hints
map ctrl+shift+u kitten hints

# Search
map ctrl+shift+f show_scrollback

# Clear

# Scrollback pager (closest analog to alacritty's vi mode)
map ctrl+shift+space show_scrollback


# BEGIN_KITTY_THEME
# GitHub Dark
include current-theme.conf
# END_KITTY_THEME